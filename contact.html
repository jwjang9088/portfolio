<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfaf3">
  <title>CONTACT — JANGJAEWON</title>
  <link rel="stylesheet" href="styles.css?v=20261114-hover50">
  <script src="contact.js" defer></script>
  <link rel="stylesheet" href="analytics.css">
  <script src="analytics.js" defer></script>
  <script src="image-recovery.js" defer></script>
</head>
<body class="gallery-page">
  <div class="viewport">
<header class="header">
        <a class="brand" href="./index.html" aria-label="JANGJAEWON 홈">JANGJAEWON</a>
        <nav class="navigation" aria-label="주 메뉴">
          <a href="about.html">ABOUT</a>
          <a href="ai.html">AI</a>
          <a href="work.html">WORK</a>
          <a href="photography.html">PHOTOGRAPHY</a>
        </nav>
        <a class="contact" href="contact.html" aria-current="page">CONTACT</a>
      </header>

    <main class="contact-layout">
      <section class="contact-intro" aria-labelledby="contact-title">
        <img class="contact-art" src="assets/contact-me.png.webp" width="160" height="160" alt="" aria-hidden="true">
        <p class="contact-eyebrow">CONTACT</p>
        <h1 id="contact-title">Get in touch</h1>
        <p class="contact-description">작업에 관한 문의나 함께 나누고 싶은 이야기를 보내주세요.</p>
        <div class="contact-email-block">
          <span class="contact-email-label">EMAIL</span>
          <a class="contact-email-address" href="mailto:woneer@naver.com">woneer@naver.com<span aria-hidden="true">↗</span></a>
          <button class="contact-copy" type="button" data-copy-email="woneer@naver.com">이메일 주소 복사</button>
          <p class="contact-copy-status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <section class="contact-paper" aria-labelledby="contact-form-title">
        <h2 id="contact-form-title">메시지 보내기</h2>
        <p class="contact-form-intro">작성한 내용을 메일 앱에서 확인하고 보내실 수 있어요.</p>
        <form class="contact-form" action="mailto:woneer@naver.com" method="get" data-recipient="woneer@naver.com">
          <div class="contact-field-row">
            <div class="contact-field"><label for="contact-name">이름 <span>(선택)</span></label><input id="contact-name" name="sender_name" type="text" autocomplete="name" maxlength="80" placeholder="성함 또는 회사명"></div>
            <div class="contact-field"><label for="contact-email">이메일 <span>(필수)</span></label><input id="contact-email" name="sender_email" type="email" autocomplete="email" maxlength="254" required placeholder="답변받으실 이메일"></div>
          </div>
          <div class="contact-field"><label for="contact-subject">제목 <span>(필수)</span></label><input id="contact-subject" name="subject" type="text" maxlength="160" required placeholder="어떤 이야기인가요?"></div>
          <div class="contact-field"><label for="contact-message">메시지 <span>(필수)</span></label><textarea id="contact-message" name="body" rows="7" maxlength="2000" required placeholder="문의하실 내용을 자유롭게 남겨주세요."></textarea></div>
          <div class="contact-form-footer"><p>메일 앱에서 최종 전송해 주세요.</p><button class="contact-submit" type="submit" disabled>메일 앱 열기 <span aria-hidden="true">↗</span></button></div>
          <p class="contact-form-status" role="status" aria-live="polite"></p>
          <noscript><p class="contact-no-script">이메일 주소를 눌러 메일 앱에서 직접 작성해 주세요.</p></noscript>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
